resources:
  jobs:
    demand_forecasting_v2:
      name: oil_and_gas_pipeline_v2

      email_notifications:
        on_start:
          - hsshinnde0702@gmail.com
        on_success:
          - hsshinnde0702@gmail.com
        on_failure:
          - hsshinnde0702@gmail.com
          
        on_duration_warning_threshold_exceeded:
          - hsshinnde0702@gmail.com
#check
      tasks:
        - task_key: Data_Engineering
          spark_python_task:
            python_file: ../src/entry_points/run_data_engineering.py
          environment_key: de_environment

        - task_key: Feature_Eng_to_Model_Training
          depends_on:
            - task_key: Data_Engineering
          spark_python_task:
            python_file: ../src/entry_points/run_feature_training.py
          environment_key: feature_training_environment

        - task_key: Inferencing
          depends_on:
            - task_key: Feature_Eng_to_Model_Training
          spark_python_task:
            python_file: ../src/entry_points/run_inference.py
          environment_key: inference_environment

      queue:
        enabled: true

      environments:
        - environment_key: de_environment
          spec:
            environment_version: "2"
            dependencies:
              - -r ${workspace.file_path}/requirements.txt

        - environment_key: feature_training_environment
          spec:
            environment_version: "2"
            dependencies:
              - -r ${workspace.file_path}/requirements.txt

        - environment_key: inference_environment
          spec:
            environment_version: "2"
            dependencies:
              - -r ${workspace.file_path}/requirements.txt

      performance_target: PERFORMANCE_OPTIMIZED